[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "smart-clipboard-manager"
version = "0.1.0"
description = "Local clipboard history with OCR, pinning and expiry"
requires-python = ">=3.10"
dependencies = ["pyperclip>=1.8.2", "Pillow>=10.0.0", "pystray>=0.19.5"]
[project.scripts]
smartclip = "smartclip.__main__:main"
[tool.pytest.ini_options]
testpaths = ["tests"]
